services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: devtrail
      POSTGRES_PASSWORD: devtrail
      POSTGRES_DB: devtrail
    ports:
      - "5432:5432"
    volumes:
      - devtrail_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devtrail -d devtrail"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  devtrail_postgres:
